# Niches: which deals go to which public channels and website sections.
# A deal matches a niche if its store is listed under `stores`,
# OR one of the `keywords` appears in the deal text (whole words, case-insensitive).
# Channel IDs / webhooks / premium links live in .env as:
#   <ID>_FREE_TELEGRAM, <ID>_PAID_TELEGRAM, <ID>_FREE_DISCORD, <ID>_PAID_DISCORD, <ID>_PREMIUM_URL
#   (e.g. FARM_FREE_TELEGRAM=@farmdeals)

niches:
  - id: farm
    name: Farm, Ranch & Outdoor Deals
    emoji: "🚜"
    stores:
