<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deal Hunter Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 30px auto; max-height: none; }
    label { display: block; font-weight: 700; font-size: 18px; margin: 20px 0 6px; }
    input {
      width: 100%; padding: 12px; font-size: 17px; border-radius: 8px;
      border: 2px solid var(--border); background: var(--card); color: var(--text);
    }
    .hint { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .row { margin-top: 24px; }
    #msg { margin-top: 18px; font-size: 18px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>🏷️ Deal Hunter Settings</h1>

  <label for="mode">Where Deal Hunter runs</label>
  <select id="mode" style="width:100%;padding:12px;font-size:17px;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--text)">
    <option value="site">My deals website (GitHub) - no key needed</option>
    <option value="server">A Deal Hunter server (my PC or a cloud server)</option>
  </select>

  <label for="apiUrl">Address</label>
  <input id="apiUrl" type="url" placeholder="https://kylelear5-beep.github.io/deal-hunter">
  <div class="hint" id="urlHint"></div>

  <div id="keyBox">
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="Paste your key here" autocomplete="off">
    <div class="hint">Use MASTER_API_KEY from your .env file, or a key from add-key.bat.</div>
  </div>

  <div class="row">
    <button id="save" class="primary">Save &amp; test</button>
  </div>
  <div id="msg" aria-live="polite"></div>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
