# Runs every test on each pull request (and on pushes to main).
# Auto-fix pull requests are only merged when this check passes.
name: tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "sheets/**", "dist/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q
