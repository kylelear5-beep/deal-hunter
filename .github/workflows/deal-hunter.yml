# Deal Hunter on GitHub Actions: free on public repositories.
# Every 30 minutes: scan, post deals, send due digests/reports, rebuild and publish the website.
# Settings come from ONE repository secret named ENV_FILE (the whole .env file pasted in).
# The database is kept on the "data" branch (latest copy + 7 daily backups).
name: Deal Hunter

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:              # new code goes live right away instead of waiting for the timer
    branches: [main]
    paths-ignore: ["**.md", "dist/**", "extension/**", "sheets/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write     # lets each run start the next one (see the last step)

concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DB_PATH: data/deals.db
      BACKUP_DIR: data/backups
      SITE_DIR: site
      CLICK_TRACKING: "false"
      PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      LOOP_MINUTES: "30"
      MAX_AI_ITEMS_PER_RUN: "20"   # free Gemini limit; this wins over the ENV_FILE value
      PYTHONUTF8: "1"
    steps:
      - name: Note start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Write settings file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Add a repository secret named ENV_FILE (paste your whole .env file)."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" | sed 's/\r$//' > .env

      - name: Load database from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          else
            mkdir -p data
          fi
          rm -rf data/.git

      - name: Run Deal Hunter
        # Its own limit, so the database and website below are always saved.
        timeout-minutes: 25
        continue-on-error: true
        run: python main.py actions

      - name: Save database to the data branch
        if: always()
        run: |
          [ -f data/deals.db ] || exit 0
          cd data
          git init -q -b data
          git config user.name "deal-hunter-bot"
          git config user.email "deal-hunter-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Deal Hunter data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Keep the schedule alive
        # GitHub pauses schedules after 60 days without commits; an empty commit every ~50 days prevents it.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "deal-hunter-bot"
            git config user.email "deal-hunter-bot@users.noreply.github.com"
            git commit --allow-empty -q -m "keepalive"
            git push -q
          fi

      - name: Remove settings file
        if: always()
        run: rm -f .env

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub's built-in schedule can be late or skipped, so each run also starts the
      # next one, 30 minutes after it began. Cancel a run on GitHub to stop the chain.
      - name: Start the next run in 30 minutes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others() {
            gh run list -R "$GITHUB_REPOSITORY" -w deal-hunter.yml --json status,databaseId \
              -q "[.[] | select((.status==\"queued\" or .status==\"waiting\" or .status==\"pending\" or .status==\"in_progress\") and .databaseId != ${{ github.run_id }})] | length"
          }
          # Wait until 30 minutes after this run began, but step aside as soon as another run
          # (for example one started by a code update) is waiting, so updates go live fast.
          while [ $(( RUN_STARTED + 1800 - $(date +%s) )) -gt 0 ]; do
            if [ "$(others)" -gt 0 ] 2>/dev/null; then
              echo "A newer run is waiting; handing over to it."
              exit 0
            fi
            sleep 60
          done
          waiting=$(others)
          if [ "${waiting:-0}" -gt 0 ]; then
            echo "Another run is already lined up; not starting a second one."
          else
            gh workflow run deal-hunter.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Next run started."
          fi
