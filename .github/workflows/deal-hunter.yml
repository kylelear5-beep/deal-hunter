# Deal Hunter on GitHub Actions: free on public repositories.
# Every 30 minutes: scan, post deals, send due digests/reports, rebuild and publish the website.
# Settings come from ONE repository secret named ENV_FILE (the whole .env file pasted in).
# The database is kept on the "data" branch (latest copy + 7 daily backups).
name: Deal Hunter

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DB_PATH: data/deals.db
      BACKUP_DIR: data/backups
      SITE_DIR: site
      CLICK_TRACKING: "false"
      MAX_AI_ITEMS_PER_RUN: "100"   # ~12 min per run; the run step stops at 18
      PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      LOOP_MINUTES: "30"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Write settings file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Add a repository secret named ENV_FILE (paste your whole .env file)."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" | sed 's/\r$//' > .env

      - name: Load database from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          else
            mkdir -p data
          fi
          rm -rf data/.git

      - name: Run Deal Hunter
        # Its own limit, so the database and website below are always saved.
        timeout-minutes: 18
        continue-on-error: true
        run: python main.py actions

      - name: Save database to the data branch
        if: always()
        run: |
          [ -f data/deals.db ] || exit 0
          cd data
          git init -q -b data
          git config user.name "deal-hunter-bot"
          git config user.email "deal-hunter-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Deal Hunter data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Keep the schedule alive
        # GitHub pauses schedules after 60 days without commits; an empty commit every ~50 days prevents it.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "deal-hunter-bot"
            git config user.email "deal-hunter-bot@users.noreply.github.com"
            git commit --allow-empty -q -m "keepalive"
            git push -q
          fi

      - name: Remove settings file
        if: always()
        run: rm -f .env

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
